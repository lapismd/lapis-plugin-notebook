packages:
  - "."
  - "packages/*"

linkWorkspacePackages: true

overrides:
  # Converge the published peer graph onto one kernel instance. api@0.2.0
  # and ui@0.1.4 declare the current design-core ^0.7.0 / mira ~0.1.2 /
  # ui ^0.1.4 peers, but markdown@0.1.7 and search@0.1.3 still declare
  # api ^0.1.2 and legacy ranges; without these overrides pnpm materializes
  # nested duplicate instances and host typechecks split across kernel
  # types. Remove the markdown/search entries when republished releases
  # declare the current peer ranges.
  "@lapismd/design-core": "0.7.0"
  "@lapismd/mira": "0.1.2"
  "@lapis-notes/ui": "0.1.4"
  "@codemirror/autocomplete": "6.20.3"
  "@codemirror/commands": "6.10.4"
  "@codemirror/lang-markdown": "6.5.2"
  "@codemirror/lang-yaml": "6.1.3"
  "@codemirror/language": "6.12.4"
  "@codemirror/lint": "6.9.7"
  "@codemirror/search": "6.7.1"
  "@codemirror/state": "6.7.1"
  "@codemirror/view": "6.43.8"
  "@internationalized/date": "3.12.2"
  "@lezer/common": "1.5.2"
  "@lezer/highlight": "1.2.3"
  "@lezer/markdown": "1.7.2"
  "@lezer/lr": "1.4.10"
  svelte: "5.56.10"

packages:
  - "."
  - "packages/*"

linkWorkspacePackages: true

overrides:
  # Patched KaTeX supported by the published Markdown/Mermaid dependency.
  katex: ">=0.18.2"
  # Converge the published peer graph onto API 0.2.4's host cohort.
  # These registry pins keep one kernel instance for runtime and typechecks.
  "@lapismd/design-core": "0.13.2"
  "@lapismd/mira": "0.2.0"
  "@lapis-notes/ui": "0.1.6"
  "@codemirror/autocomplete": "6.20.4"
  "@codemirror/commands": "6.11.1"
  "@codemirror/lang-markdown": "6.5.2"
  "@codemirror/lang-yaml": "6.1.3"
  "@codemirror/language": "6.13.1"
  "@codemirror/lint": "6.9.7"
  "@codemirror/search": "6.7.2"
  "@codemirror/state": "6.7.6"
  "@codemirror/view": "6.43.15"
  "@internationalized/date": "3.12.4"
  "@lezer/common": "1.5.5"
  "@lezer/highlight": "1.2.5"
  "@lezer/markdown": "1.8.1"
  "@lezer/lr": "1.4.12"
  svelte: "5.56.10"

# Exact published Design Core consumer requirement; see patches/README.md.
patchedDependencies:
  bits-ui@2.20.2: patches/bits-ui@2.20.2.patch

# Same documented, user-approved exception as Tasks; no patched release exists.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

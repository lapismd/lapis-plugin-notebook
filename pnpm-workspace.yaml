packages:
  - "."
  - "packages/*"

linkWorkspacePackages: true

overrides:
  # Converge the published @lapis-notes/api peer graph onto one instance.
  # api@0.1.4 declares design-core ^0.3.2 / mira ~0.0.3 peers while the
  # family standardizes on 0.6.0 / 0.1.1; without these overrides pnpm
  # materializes a second nested api instance (design-core 0.3.5 context)
  # and host typechecks split across duplicate kernel types. Remove when a
  # published api release declares the current peer ranges.
  "@lapismd/design-core": "0.6.0"
  "@lapismd/mira": "0.1.1"
  "@lapis-notes/ui": "0.1.3"
  "@codemirror/autocomplete": "6.20.3"
  "@codemirror/commands": "6.10.4"
  "@codemirror/lang-markdown": "6.5.2"
  "@codemirror/lang-yaml": "6.1.3"
  "@codemirror/language": "6.12.4"
  "@codemirror/lint": "6.9.7"
  "@codemirror/search": "6.7.1"
  "@codemirror/state": "6.7.1"
  "@codemirror/view": "6.43.8"
  "@internationalized/date": "3.12.2"
  "@lezer/common": "1.5.2"
  "@lezer/highlight": "1.2.3"
  "@lezer/markdown": "1.7.2"
  "@lezer/lr": "1.4.10"
  svelte: "5.56.10"

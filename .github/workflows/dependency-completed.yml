name: Notify dependency completion
on:
  workflow_run:
    workflows:
      - CI
      - Publish Storybook to GitHub Pages
      - Version packages
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    uses: lapismd/dependency-automation/.github/workflows/completion.yml@c1c5ddf184af4166ee11ea3329e7ca85f8333828
    with:
      automation-ref: c1c5ddf184af4166ee11ea3329e7ca85f8333828
    secrets:
      app-private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}

name: Publish Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

defaults:
  run:
    shell: bash

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Sibling repositories are absent on CI, and the tracked lockfile is
      # registry-pure (generated with pnpm hooks ignored), so the frozen
      # install must ignore .pnpmfile.cjs as well — this also guarantees
      # registry resolution for every published LapisMD dependency
      # (LPN-SPEC-005).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # Publication pipeline (not a validation lane): build the catalog
      # directly with the same command the portable build-storybook lane
      # classifies. Validation stays Docker-gated in ci.yml.
      - name: Build static Storybook
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec storybook build --config-dir .storybook --output-dir storybook-static

      - name: Verify complete static Storybook
        run: |
          test -f storybook-static/index.html
          test -f storybook-static/iframe.html
          test -f storybook-static/index.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    name: Deploy static Storybook
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

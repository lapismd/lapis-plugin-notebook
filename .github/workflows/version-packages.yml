name: Version packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: notebook-version-packages
  cancel-in-progress: false

jobs:
  version:
    name: Open version pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Open or update the version pull request
        uses: changesets/action@v1.8.0
        with:
          version: pnpm release:version
          commitMode: github-api
          title: "chore: version Notebook package"
          commit: "chore: version Notebook package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

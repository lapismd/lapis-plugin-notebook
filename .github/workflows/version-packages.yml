name: Version packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notebook-version-packages
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main' && vars.LAPIS_DEPENDENCY_VERSION_PR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
      - name: Activate the repository's pinned package manager
        run: |
          corepack enable
          package_manager="$(node -p 'require("./package.json").packageManager')"
          corepack prepare "$package_manager" --activate
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Mint a token for this repository's version PR
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm release:version
          commitMode: github-api
          createGithubReleases: false
          title: "chore: version Notebook package"
          commit: "chore: version Notebook package"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
